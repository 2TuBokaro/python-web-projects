<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modi Medical</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>Login to Modi Medical</h1>
                <p>Wholesale Medicine Distributor - Bokaro</p>
            </div>
            
            <div class="login-form">
                <form id="simpleLoginForm">
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="role">Role *</label>
                        <select id="role" name="role" required>
                            <option value="">Select role...</option>
                            <option value="admin">Admin</option>
                            <option value="staff">Staff</option>
                            <option value="public">Public</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                
                <div class="login-footer">
                    <p>Default credentials: admin / password</p>
                    <p><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="config/app-config.js"></script>
    <script src="data-layer.js"></script>
    <script>
        // Simple login handler
        document.getElementById('simpleLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            console.log('Login attempt:', { username, password, role });
            
            // Simple authentication check
            const users = JSON.parse(localStorage.getItem('modi_users') || '[]');
            const user = users.find(u => u.username === username && u.password === password && u.role === role);
            
            if (user) {
                console.log('Login successful:', user);
                alert('Login successful! User: ' + user.name);
                // Store user in session
                localStorage.setItem('current_user', JSON.stringify(user));
                // Set session for main page authentication
                localStorage.setItem('modi_session', JSON.stringify({
                    user_id: user.id,
                    username: user.username,
                    role: user.role,
                    created_at: new Date().getTime()
                }));
                // Redirect to main page - it will show the appropriate dashboard
                window.location.href = 'index.html';
            } else {
                console.log('Login failed');
                alert('Invalid credentials. Please try again.');
            }
        });
    </script>
</body>
</html>
